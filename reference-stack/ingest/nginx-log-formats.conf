# The nginx configuration that produces exactly the three files in ../data/.
# Included here so trainees can see where every field comes from, and so the dataset can
# be reproduced against a real nginx if you ever want to.

http {
    ##
    ## data/access.log -- stock nginx `combined`. Unmodified, so it matches
    ## grok %{HTTPD_COMBINEDLOG} / the deprecated %{COMBINEDAPACHELOG} exactly.
    ##
    log_format combined '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log combined;

    ##
    ## data/access.json.log -- the structured target shape, describing the SAME requests.
    ## escape=json (nginx >= 1.11.8) means values are JSON-escaped rather than \xXX-escaped.
    ##
    log_format json_analytics escape=json
        '{'
          '"time_iso8601":"$time_iso8601",'          # second resolution, RFC3339
          '"msec":"$msec",'                          # epoch seconds w/ ms -- use this one
          '"hostname":"$hostname",'                  # which edge node wrote the line
          '"remote_addr":"$remote_addr",'
          '"remote_user":"$remote_user",'
          '"http_x_forwarded_for":"$http_x_forwarded_for",'
          '"request_method":"$request_method",'
          '"request_uri":"$request_uri",'            # path + query, NOT the whole request line
          '"server_protocol":"$server_protocol",'
          '"scheme":"$scheme",'
          '"host":"$host",'
          '"server_name":"$server_name",'
          '"status":$status,'                        # number, not string
          '"body_bytes_sent":$body_bytes_sent,'      # response body actually sent (post-gzip)
          '"bytes_sent":$bytes_sent,'                # body + response headers
          '"request_length":$request_length,'        # request line + headers + body
          '"request_time":$request_time,'            # nginx-observed, seconds, ms resolution
          '"upstream_addr":"$upstream_addr",'        # "-" when nginx served it locally
          '"upstream_status":"$upstream_status",'
          '"upstream_response_time":"$upstream_response_time",'
          '"upstream_connect_time":"$upstream_connect_time",'
          '"upstream_header_time":"$upstream_header_time",'
          '"http_referer":"$http_referer",'
          '"http_user_agent":"$http_user_agent",'
          '"request_id":"$request_id",'              # per-request, 32 hex chars
          '"ssl_protocol":"$ssl_protocol",'
          '"ssl_cipher":"$ssl_cipher",'
          '"gzip_ratio":"$gzip_ratio",'
          '"connection":$connection,'                # per-TCP-connection serial
          '"connection_requests":$connection_requests'  # 1..n within that connection
        '}';

    access_log /var/log/nginx/access.json.log json_analytics;

    ##
    ## data/error.log -- nginx's error log format is NOT configurable, hence no directive.
    ## Note there is no $request_id in it: correlate to the access log via the leading
    ## *<connection> number instead.
    ##
    error_log /var/log/nginx/error.log info;   # `info` so client-side aborts show up too

    # --- settings the dataset's numbers reflect ---------------------------------------
    keepalive_timeout   75s;      # drives the ~7.4 requests-per-connection average
    gzip                on;
    gzip_comp_level     5;
    gzip_types          text/css application/javascript application/json image/svg+xml;

    upstream web { server 10.0.2.11:8080; server 10.0.2.12:8080;
                   server 10.0.2.13:8080; server 10.0.2.14:8080; }
    upstream api { server 10.0.3.11:9000; server 10.0.3.12:9000; server 10.0.3.13:9000;
                   server 10.0.3.14:9000; server 10.0.3.15:9000; server 10.0.3.16:9000; }

    proxy_read_timeout  60s;      # why every 504 in the data has request_time ~= 60.0
    proxy_next_upstream error timeout http_502;   # why 502s show two comma-joined upstreams

    # Left at the stock default on purpose. 4720 proxied responses in this dataset exceed
    # 8*4k = 32 KB, and nginx spools every one of them to a temp file and logs a [warn].
    # That single line of untuned config is the largest contributor to error.log -- which is
    # the point: most of a real nginx error log is tuning noise, not failures.
    proxy_buffers       8 4k;
    proxy_buffer_size   4k;
    proxy_max_temp_file_size 1024m;

    # burst -> nginx DELAYS and logs [warn] "delaying request"; past the burst it rejects
    # with 503 and logs [error] "limiting requests". Two levels, one mechanism.
    limit_req_zone $binary_remote_addr zone=perip:16m rate=40r/s;
    limit_req_zone $binary_remote_addr zone=login:8m  rate=2r/s;
    limit_req      zone=perip burst=20;
    limit_req      zone=login burst=5;
    limit_req_status 503;

    # max_fails/fail_timeout are what produce [warn] "upstream server temporarily disabled"
    # alongside the connection-refused 502s.
    # (set per-server in the upstream blocks above; defaults are max_fails=1 fail_timeout=10s)
}
